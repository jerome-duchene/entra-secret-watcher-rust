[package]
name = "entra-secret-watcher"
version = "0.1.0"
edition = "2024"
description = "Watches the secrets and certificates of Microsoft Entra ID app registrations and notifies before they expire"
license = "Apache-2.0"
repository = "https://github.com/jerome-duchene/entra-secret-watcher-rust"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
croner = "4.0.2"
opentelemetry = "0.33.1"
opentelemetry-appender-tracing = "0.33.1"
opentelemetry-otlp = { version = "0.33.1", features = ["grpc-tonic", "http-proto", "reqwest-rustls", "trace", "metrics", "logs"] }
opentelemetry_sdk = { version = "0.33.1", features = ["rt-tokio"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "form"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
subtle = "2.6.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
tracing = "0.1.44"
tracing-opentelemetry = "0.34.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
wiremock = "0.6.5"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
